<title>키보드 프레임 편집기</title>
<style>
  :root{
    --bg:#eceff1;--surface:#fff;--sunken:#f2f5f7;
    --key:#fff;--key-act:#b0bec5;--key-code:#cfd8dc;
    --text:#1a1a1a;--muted:#5c6b78;--border:#cbd5db;
    --accent:#2e9e46;--ink:#fff;--danger:#c0392b;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;--r:9px;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#14181b;--surface:#1d2329;--sunken:#171c21;
    --key:#2a333b;--key-act:#454e56;--key-code:#3a444d;
    --text:#e6edf3;--muted:#8b98a5;--border:#313b44;
    --accent:#4caf50;--ink:#08130a;--danger:#e5786d;
  }}
  :root[data-theme="dark"]{--bg:#14181b;--surface:#1d2329;--sunken:#171c21;--key:#2a333b;--key-act:#454e56;--key-code:#3a444d;--text:#e6edf3;--muted:#8b98a5;--border:#313b44;--accent:#4caf50;--ink:#08130a;--danger:#e5786d;}
  :root[data-theme="light"]{--bg:#eceff1;--surface:#fff;--sunken:#f2f5f7;--key:#fff;--key-act:#b0bec5;--key-code:#cfd8dc;--text:#1a1a1a;--muted:#5c6b78;--border:#cbd5db;--accent:#2e9e46;--ink:#fff;--danger:#c0392b;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:22px 18px 64px}
  h1{font-size:21px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13.5px;margin:0}
  code.i{font-family:var(--mono);background:var(--sunken);padding:1px 5px;border-radius:4px;font-size:12.5px}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 6px;padding:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
  .tabs{display:flex;gap:4px}
  .tab{font:600 13.5px var(--ui);padding:6px 14px;cursor:pointer;background:transparent;color:var(--muted);
    border:1px solid transparent;border-radius:6px}
  .tab[aria-selected="true"]{background:var(--accent);color:var(--ink)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .vr{width:1px;height:24px;background:var(--border)}
  .spacer{flex:1}
  button.act{font:600 13px var(--ui);padding:7px 13px;cursor:pointer;background:var(--sunken);color:var(--text);
    border:1px solid var(--border);border-radius:6px}
  button.act:hover{border-color:var(--accent)}
  button.act.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  button.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hint{color:var(--muted);font-size:12.5px}

  .board{background:var(--sunken);border:1px solid var(--border);border-radius:var(--r);padding:9px;overflow-x:auto}
  .krow{display:flex;gap:4px;margin-bottom:5px;min-width:560px;align-items:stretch}
  .krow:last-child{margin-bottom:0}
  .rowtools{display:flex;flex-direction:column;gap:2px;flex:0 0 22px;justify-content:center}
  .rowtools button{font:600 11px var(--mono);line-height:1;cursor:pointer;width:22px;height:15px;padding:0;
    color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:4px}
  .rowtools button:hover{color:var(--text);border-color:var(--accent)}
  .keys{display:flex;gap:4px;flex:1}
  .key{font:500 15px var(--mono);min-width:26px;min-height:48px;padding:4px 2px;flex-basis:0;cursor:grab;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:var(--key);color:var(--text);border:1px solid var(--border);border-radius:7px;
    overflow:hidden;white-space:nowrap;position:relative}
  .key.k-act{background:var(--key-act);font-size:12px;font-weight:600}
  .key.k-code{background:var(--key-code);font-size:11px}
  .key.sel{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .key.drop-before{box-shadow:-3px 0 0 var(--accent)}
  .key.dragging{opacity:.4}
  .key .alt{font:400 9px var(--mono);color:var(--muted);margin-top:2px;line-height:1.1}
  .addkey{font:600 16px var(--mono);cursor:pointer;min-width:24px;color:var(--muted);background:transparent;
    border:1px dashed var(--border);border-radius:7px;flex:0 0 auto}
  .addkey:hover{color:var(--accent);border-color:var(--accent)}
  .foot{display:flex;gap:8px;margin-top:10px;align-items:center}

  .grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
  @media(min-width:820px){.grid{grid-template-columns:1fr 320px}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .field input,.field select{width:100%;font:14px var(--mono);padding:7px 9px;background:var(--sunken);
    color:var(--text);border:1px solid var(--border);border-radius:6px}
  .field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .rowbtns{display:flex;gap:6px;margin-top:8px}
  .rowbtns button{flex:1}
  button.danger{color:var(--ink);background:var(--danger);border-color:var(--danger)}
  .empty{color:var(--muted);font-size:13px}
  textarea{width:100%;min-height:150px;font:12.5px/1.5 var(--mono);padding:12px;background:var(--sunken);
    color:var(--text);border:1px solid var(--border);border-radius:6px;resize:vertical;tab-size:2}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .io-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .io-head h2{margin:0;flex:1}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);
    color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:600;opacity:0;
    pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<div class="wrap">
  <header>
    <h1>키보드 프레임 편집기</h1>
    <p class="sub">하나의 격자에서 각 키가 <b>한글·영문·기호</b> 값을 함께 가집니다. 미리보기 레이어를 바꿔도 키는 안 움직이고 값만 바뀝니다. 아래 JSON 을 앱 <code class="i">설정 → 레이아웃 편집 → 적용</code> 에 붙여넣으세요.</p>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="프로파일">
      <button class="tab" role="tab" data-profile="unfolded" aria-selected="true">펼침</button>
      <button class="tab" role="tab" data-profile="folded" aria-selected="false">접힘</button>
    </div>
    <span class="vr"></span>
    <span class="hint">미리보기 레이어</span>
    <div class="tabs" role="tablist" aria-label="레이어">
      <button class="tab" role="tab" data-layer="kor" aria-selected="true">한글</button>
      <button class="tab" role="tab" data-layer="eng" aria-selected="false">영문</button>
      <button class="tab" role="tab" data-layer="sym" aria-selected="false">기호</button>
    </div>
    <div class="spacer"></div>
    <button class="act" id="btn-theme">◐ 테마</button>
    <button class="act" id="btn-default">기본 프레임</button>
  </div>

  <div class="board" id="board" aria-label="키보드 프레임"></div>
  <div class="foot">
    <button class="act" id="btn-addrow">＋ 행 추가</button>
    <span class="hint" id="rowcount"></span>
    <span class="spacer"></span>
    <span class="hint">키 위 작은 글씨 = 다른 두 레이어 값</span>
  </div>

  <div class="grid">
    <section class="panel">
      <div class="io-head"><h2>레이아웃 JSON</h2>
        <button class="act primary" id="btn-copy">복사</button>
        <button class="act" id="btn-import">붙여넣기 불러오기</button></div>
      <textarea id="json" spellcheck="false" aria-label="레이아웃 JSON"></textarea>
      <p class="hint" style="margin-top:8px">앱에서 <code class="i">기본값 불러오기</code> 로 현재 프레임을 복사해 여기 붙여넣고 <b>붙여넣기 불러오기</b> 하면 그걸 편집합니다.</p>
    </section>

    <aside class="panel" id="inspector">
      <h2>키 편집</h2>
      <div id="insp"><p class="empty">키를 선택하세요.</p></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ── 특수 키 ── */
const ACT={SHIFT:"⇧",BACKSPACE:"⌫",SPACE:"space",ENTER:"↵",LANGUAGE:"한/A",SYMBOLS:"?123",
  CTRL:"ctrl",ALT:"alt",CLIPBOARD:"📋",SNIPPETS:"✂",LEFT:"◀",RIGHT:"▶",UP:"▲",DOWN:"▼",
  COMMA:",",PERIOD:".",SELECT_ALL:"전체",COPY:"복사",PASTE:"붙여",CUT:"잘라",UNDO:"되돌"};
const CODE={TAB:"tab",ESC:"esc",DEL:"del",HOME:"home",END:"end",PGUP:"pgup",PGDN:"pgdn"};

/* ── 슬롯 모델 ──
   char slot: {t:'ch', kor,eng,sym, w}
   fn slot:   {t:'act', act, l, w}  |  {t:'code', code, l} */
const same=(s,w=1)=>({t:"ch",kor:s,eng:s,sym:s,w});
const cc=(kor,eng,sym,w=1)=>({t:"ch",kor,eng,sym,w});
const A=(act,w=0)=>({t:"act",act,l:ACT[act]||"",w});
const KC=(code)=>({t:"code",code,l:CODE[code]});

function defaultProfile(aux){
  const term=[KC("TAB"),A("ALT"),KC("DEL"),KC("HOME"),KC("END"),A("CLIPBOARD"),A("SNIPPETS"),KC("PGUP"),KC("PGDN"),same("+"),same("-"),same("=")];
  const prog=["'","\"","|","/","\\","{","}","[","]","_"].map(s=>same(s));
  const num="1 2 3 4 5 6 7 8 9 0".split(" ").map(s=>same(s));
  const r1=[cc("ㅂ","q","!",1.25),cc("ㅈ","w","@"),cc("ㄷ","e","#"),cc("ㄱ","r","$"),cc("ㅅ","t","%"),cc("ㅛ","y","^"),cc("ㅕ","u","4"),cc("ㅑ","i","5"),cc("ㅐ","o","6"),cc("ㅔ","p","/",1.25)];
  const r2=[cc("ㅁ","a","&",1.5),cc("ㄴ","s","*"),cc("ㅇ","d","-"),cc("ㄹ","f","+"),cc("ㅎ","g","="),cc("ㅗ","h","\\"),cc("ㅓ","j","1"),cc("ㅏ","k","2"),cc("ㅣ","l","3",1.5)];
  const r3=[A("SHIFT",1.5),cc("ㅋ","z","("),cc("ㅌ","x",")"),cc("ㅊ","c","["),cc("ㅍ","v","]"),cc("ㅠ","b","<"),cc("ㅜ","n","."),cc("ㅡ","m","0"),A("BACKSPACE",1.5)];
  const act=[A("CTRL"),A("SYMBOLS"),A("LANGUAGE"),A("LEFT"),A("SPACE",1.56),A("UP",0.94),A("DOWN"),same("?"),A("COMMA",0.94),A("SPACE",1.56),A("RIGHT"),A("PERIOD"),A("ENTER")];
  const pre = aux==="all"?[term,prog,num] : aux==="term"?[term] : [];
  return [...pre,r1,r2,r3,act];
}
function defaultLayout(){return {unfolded:defaultProfile("all"), folded:defaultProfile("term")};}

let layout=defaultLayout();
let profile="unfolded", layer="kor", sel=null, drag=null;
const rows=()=>layout[profile];

/* ── 직렬화 (앱 프레임 형식) ── */
function slotToJson(s){
  if(s.t==="act"){const o={act:s.act};if(s.l)o.l=s.l;if(s.w>0)o.w=s.w;return o;}
  if(s.t==="code")return {code:s.code,l:s.l};
  if(s.kor===s.eng&&s.eng===s.sym){const o={k:s.kor};if(s.w!==1)o.w=s.w;return o;}
  const o={kor:s.kor,eng:s.eng,sym:s.sym};if(s.w!==1)o.w=s.w;return o;
}
function frameJson(prof){return prof.map(row=>row.map(slotToJson));}
function toJson(){return JSON.stringify({unfolded:{frame:frameJson(layout.unfolded)},folded:{frame:frameJson(layout.folded)}},null,2);}

function slotFromJson(it){
  if(typeof it==="string")return same(it);
  if(it.act!=null)return {t:"act",act:it.act,l:it.l||ACT[it.act]||"",w:it.w||0};
  if(it.code!=null)return {t:"code",code:it.code,l:it.l||CODE[it.code]||it.code.toLowerCase()};
  if(it.kor!=null||it.eng!=null||it.sym!=null)return cc(it.kor||"",it.eng||"",it.sym||"",it.w||1);
  if(it.k!=null)return same(it.k,it.w||1);
  return same(String(it));
}
function frameFromJson(arr){return arr.map(row=>row.map(slotFromJson));}
function loadJson(str){
  const root=JSON.parse(str);
  function prof(o){
    if(o&&o.frame)return frameFromJson(o.frame);
    // 호환: 모드별 배열이면 한글 기준으로 프레임 근사(영/기호는 같은 위치에서 가져옴).
    if(o&&o.korean){
      const k=o.korean,e=o.english||o.korean,s=o.symbols||o.korean;
      return k.map((row,r)=>row.map((it,c)=>{
        const base=slotFromJson(it);
        if(base.t!=="ch")return base;
        const ev=e[r]&&e[r][c]!=null?valOf(e[r][c]):base.kor;
        const sv=s[r]&&s[r][c]!=null?valOf(s[r][c]):base.kor;
        return cc(base.kor,ev,sv,base.w);
      }));
    }
    return null;
  }
  function valOf(it){const sl=slotFromJson(it);return sl.t==="ch"?sl.kor:"";}
  let un,fo;
  if(root.unfolded||root.folded){un=prof(root.unfolded)||prof(root.folded);fo=prof(root.folded)||prof(root.unfolded);}
  else {un=prof(root);fo=JSON.parse(JSON.stringify(un));}
  if(!un)throw new Error("frame/korean 을 찾지 못했습니다");
  layout={unfolded:un,folded:fo};
}

/* ── 렌더 ── */
const board=document.getElementById("board");
const jsonEl=document.getElementById("json");
function label(s){return s.t==="ch"?(s[layer]||"·"):s.t==="act"?(s.l||s.act):(s.l||s.code);}
function altText(s){
  if(s.t!=="ch")return "";
  const others=["kor","eng","sym"].filter(x=>x!==layer).map(x=>s[x]||"·");
  return others.join(" ");
}
function weight(s){
  if(s.t==="act"&&s.w>0)return s.w;
  if(s.t==="act")return ({SPACE:1.5,ENTER:1.6,SHIFT:1.5,BACKSPACE:1.5})[s.act]||1;
  return s.w||1;
}
function render(){
  board.innerHTML="";
  rows().forEach((row,r)=>{
    const rowEl=document.createElement("div");rowEl.className="krow";
    const tools=document.createElement("div");tools.className="rowtools";
    tools.append(mkT("▲",()=>moveRow(r,-1)),mkT("▼",()=>moveRow(r,1)),mkT("×",()=>delRow(r)));
    rowEl.append(tools);
    const keys=document.createElement("div");keys.className="keys";
    row.forEach((s,i)=>keys.append(mkKey(s,r,i)));
    const add=document.createElement("button");add.className="addkey";add.textContent="＋";add.title="키 추가";
    add.onclick=()=>{row.push(cc("A","a","1"));sel=[r,row.length-1];sync();};
    keys.append(add);rowEl.append(keys);board.append(rowEl);
  });
  document.getElementById("rowcount").textContent=rows().length+"행";
  renderInsp();
}
function mkT(t,fn){const b=document.createElement("button");b.textContent=t;b.onclick=fn;return b;}
function mkKey(s,r,i){
  const el=document.createElement("div");
  el.className="key"+(s.t==="act"?" k-act":s.t==="code"?" k-code":"")+(sel&&sel[0]===r&&sel[1]===i?" sel":"");
  el.style.flexGrow=weight(s);
  const main=document.createElement("div");main.textContent=label(s);el.append(main);
  if(s.t==="ch"){const alt=document.createElement("div");alt.className="alt";alt.textContent=altText(s);el.append(alt);}
  el.draggable=true;
  el.onclick=()=>{sel=[r,i];sync();};
  el.addEventListener("dragstart",e=>{drag=[r,i];el.classList.add("dragging");e.dataTransfer.effectAllowed="move";});
  el.addEventListener("dragend",()=>{el.classList.remove("dragging");document.querySelectorAll(".drop-before").forEach(x=>x.classList.remove("drop-before"));});
  el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("drop-before");});
  el.addEventListener("dragleave",()=>el.classList.remove("drop-before"));
  el.addEventListener("drop",e=>{e.preventDefault();el.classList.remove("drop-before");dropOn(r,i);});
  return el;
}
function dropOn(r,i){
  if(!drag)return;
  const [fr,fi]=drag;const from=rows()[fr];const [m]=from.splice(fi,1);
  let idx=i;if(fr===r&&fi<i)idx--;
  rows()[r].splice(idx,0,m);sel=[r,idx];drag=null;sync();
}

/* ── 인스펙터 ── */
const inspEl=document.getElementById("insp");
function renderInsp(){
  if(!sel||!rows()[sel[0]]||!rows()[sel[0]][sel[1]]){inspEl.innerHTML='<p class="empty">키를 선택하세요.</p>';return;}
  const s=rows()[sel[0]][sel[1]];
  const f=[];
  f.push(field("종류",selEl({ch:"문자(레이어별)",act:"기능 키",code:"하드웨어 키"},s.t,v=>changeType(s,v))));
  if(s.t==="ch"){
    const three=document.createElement("div");three.className="three";
    three.append(miniField("한글",s.kor,v=>{s.kor=v;sync();}),
                 miniField("영문",s.eng,v=>{s.eng=v;sync();}),
                 miniField("기호",s.sym,v=>{s.sym=v;sync();}));
    const wrap=document.createElement("div");wrap.className="field";
    const l=document.createElement("label");l.textContent="레이어별 값";wrap.append(l,three);
    f.push(wrap);
    f.push(field("폭",numEl(s.w,v=>{s.w=v;sync();})));
  }else if(s.t==="act"){
    f.push(field("기능",selEl(actOpts(),s.act,v=>{s.act=v;s.l=ACT[v]||"";sync();})));
    f.push(field("라벨(선택)",inpEl(s.l,v=>{s.l=v;sync();},ACT[s.act]||"")));
    f.push(field("폭(0=기본)",numEl(s.w,v=>{s.w=v;sync();})));
  }else{
    f.push(field("키",selEl(codeOpts(),s.code,v=>{s.code=v;s.l=CODE[v];sync();})));
    f.push(field("라벨",inpEl(s.l,v=>{s.l=v;sync();},"")));
  }
  const mv=document.createElement("div");mv.className="rowbtns";
  mv.append(btn("◀ 왼쪽",()=>nudge(-1)),btn("오른쪽 ▶",()=>nudge(1)));
  const del=document.createElement("div");del.className="rowbtns";
  const d=btn("이 키 삭제",()=>{rows()[sel[0]].splice(sel[1],1);sel=null;sync();});d.classList.add("danger");del.append(d);
  inspEl.innerHTML="";f.forEach(x=>inspEl.append(x));inspEl.append(mv,del);
}
function field(lab,ctl){const w=document.createElement("div");w.className="field";const l=document.createElement("label");l.textContent=lab;w.append(l,ctl);return w;}
function miniField(lab,val,on){const w=document.createElement("div");const l=document.createElement("label");l.textContent=lab;l.style.fontSize="11px";l.style.color="var(--muted)";const i=document.createElement("input");i.value=val??"";i.oninput=()=>on(i.value);w.append(l,i);return w;}
function inpEl(val,on,ph){const i=document.createElement("input");i.value=val??"";i.placeholder=ph||"";i.oninput=()=>on(i.value);return i;}
function numEl(val,on){const i=document.createElement("input");i.type="number";i.step="0.05";i.min="0";i.value=val??1;i.oninput=()=>on(parseFloat(i.value)||0);return i;}
function selEl(opts,val,on){const s=document.createElement("select");for(const[k,l]of Object.entries(opts)){const o=document.createElement("option");o.value=k;o.textContent=l;if(k===val)o.selected=true;s.append(o);}s.onchange=()=>on(s.value);return s;}
function actOpts(){const o={};for(const k in ACT)o[k]=k+" ("+ACT[k]+")";return o;}
function codeOpts(){const o={};for(const k in CODE)o[k]=k+" ("+CODE[k]+")";return o;}
function btn(t,fn){const b=document.createElement("button");b.className="act";b.textContent=t;b.onclick=fn;return b;}
function changeType(s,t){
  if(t===s.t)return;
  for(const k in s)delete s[k];
  if(t==="ch")Object.assign(s,cc("A","a","1"));
  else if(t==="act")Object.assign(s,A("SHIFT"));
  else Object.assign(s,KC("TAB"));
  sync();
}
function nudge(d){const row=rows()[sel[0]];const j=sel[1]+d;if(j<0||j>=row.length)return;[row[sel[1]],row[j]]=[row[j],row[sel[1]]];sel[1]=j;sync();}
function moveRow(r,d){const j=r+d,rs=rows();if(j<0||j>=rs.length)return;[rs[r],rs[j]]=[rs[j],rs[r]];if(sel&&sel[0]===r)sel[0]=j;else if(sel&&sel[0]===j)sel[0]=r;sync();}
function delRow(r){if(rows().length<=1)return toast("마지막 행은 못 지웁니다");rows().splice(r,1);sel=null;sync();}

function sync(){render();jsonEl.value=toJson();}

/* ── 툴바 ── */
document.querySelectorAll(".tab[data-profile]").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab[data-profile]").forEach(x=>x.setAttribute("aria-selected",x===t));profile=t.dataset.profile;sel=null;sync();});
document.querySelectorAll(".tab[data-layer]").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab[data-layer]").forEach(x=>x.setAttribute("aria-selected",x===t));layer=t.dataset.layer;render();});
document.getElementById("btn-addrow").onclick=()=>{rows().push([cc("A","a","1"),cc("B","b","2"),cc("C","c","3")]);sync();};
document.getElementById("btn-default").onclick=()=>{layout=defaultLayout();sel=null;sync();toast("기본 프레임을 불러왔습니다");};
document.getElementById("btn-copy").onclick=async()=>{jsonEl.value=toJson();try{await navigator.clipboard.writeText(jsonEl.value);toast("복사했습니다");}catch{jsonEl.select();document.execCommand("copy");toast("복사했습니다");}};
document.getElementById("btn-import").onclick=()=>{try{loadJson(jsonEl.value);sel=null;sync();toast("불러왔습니다");}catch(e){toast("JSON 오류: "+e.message);}};
document.getElementById("btn-theme").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");const dark=c?c==="dark":matchMedia("(prefers-color-scheme:dark)").matches;document.documentElement.setAttribute("data-theme",dark?"light":"dark");};

const toastEl=document.getElementById("toast");let tt;
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),1800);}

sync();
</script>
